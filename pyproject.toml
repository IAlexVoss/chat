[project]
name = "chat"
version = "0.1.0"
description = "A simple real-time chat built with Flet"
readme = "README.md"
license = { text = "MIT" }
keywords = ["flet", "chat", "real-time", "messenger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "alexvoss2003@gmail.com" }
]
dependencies = [
    "flet>=0.80.5"
]

[project.optional-dependencies]
dev = [
    "flet-cli>=0.80.5",
    "flet-desktop>=0.80.5",
    "flet-web>=0.80.5",
]

[project.scripts]
chat = "src.main:main"

[tool.flet]
org = "com.mycompany"
product = "chat"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"


